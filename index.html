<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Racing Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
    
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; }
        
        #canvas-container { width: 100%; height: 50vh; display: block; touch-action: none; }
        #ui-container { width: 100%; height: 50vh; display: flex; flex-direction: column; }
        .btn-option { transition: all 0.1s ease; }
        .btn-option:active:not(:disabled) { transform: scale(0.95); }
        
        #speed-bar { transition: height 0.1s linear, background-color 0.1s linear; }

        /* 撞击金币时，按钮的震动动画 */
        @keyframes shakeBtn {
            0%, 100% { transform: scale(0.9) translateX(0); }
            25% { transform: scale(0.9) translateX(-8px) rotate(-3deg); }
            50% { transform: scale(0.9) translateX(8px) rotate(3deg); }
            75% { transform: scale(0.9) translateX(-8px) rotate(-3deg); }
        }
        .btn-shake { animation: shakeBtn 0.2s ease-in-out; }

        /* 光环闪烁特效 */
        @keyframes ringGlow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.9)); }
            50% { filter: drop-shadow(0 0 20px rgba(255, 235, 100, 1)); }
        }
    </style>
</head>
<body class="bg-gray-50">

    <!-- 登录界面 (修改为浅蓝色主题) -->
    <div id="login-screen" class="min-h-screen w-full bg-gradient-to-br from-sky-100 via-blue-200 to-blue-400 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-4xl rounded-2xl shadow-2xl p-6 md:p-10 relative">
            <button onclick="showTeacherLogin()" class="absolute top-4 right-4 md:top-6 md:right-6 bg-gray-100 hover:bg-gray-200 text-gray-600 text-sm py-1.5 px-4 rounded-full flex items-center gap-2 transition-colors">
                🔒 教师专区
            </button>

            <div class="text-center mb-8 mt-4 md:mt-0">
                <h1 class="text-3xl md:text-4xl font-extrabold text-blue-700 mb-2">English Racing Game</h1>
                <p class="text-gray-500 text-sm md:text-base">英语语法趣味赛车挑战系统</p>
            </div>

            <div class="flex flex-col md:flex-row gap-8">
                <!-- 左侧表单 -->
                <div class="flex-1 flex flex-col gap-5">
                    <div>
                        <label class="block text-gray-700 font-bold mb-2 text-sm">学生姓名 (中文 / 英文):</label>
                        <input type="text" id="student-name" placeholder="例如: 张小明 / Tan Ah Kow" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-bold mb-2 text-sm">教育部邮箱 (Email):</label>
                        <input type="email" id="student-email" placeholder="例如: m-1234567@moe-dl.edu.my" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <button onclick="startGame()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-lg text-lg shadow-lg transition-transform active:scale-95 mt-2 flex justify-center items-center gap-2">
                        开始答题 🚀
                    </button>
                </div>

                <!-- 右侧英雄榜 -->
                <div class="flex-1 bg-gray-50 rounded-xl border border-gray-200 p-5">
                    <h3 class="text-yellow-600 font-bold mb-4 flex items-center gap-2">
                        🏆 实时英雄榜 (Live)
                    </h3>
                    <div id="leaderboard-container" class="space-y-3 max-h-[300px] overflow-y-auto pr-2">
                        <div class="text-center text-gray-400 py-2">暂无排名数据</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 游戏主界面 -->
    <div id="game-screen" class="hidden flex flex-col h-screen w-screen overflow-hidden fixed inset-0 bg-gray-50 z-40">
        <div id="canvas-container" class="relative bg-blue-200 select-none">
            <canvas id="game-canvas" class="w-full h-full block"></canvas>
            
            <!-- 移到画面左上角的总分显示 -->
            <div class="absolute top-4 left-4 bg-gray-900/80 rounded-full border-2 border-yellow-500 px-3 py-1.5 md:px-4 md:py-2 z-20 shadow-lg flex items-center gap-2">
                <span class="text-white font-bold text-xs md:text-sm">⭐ Score:</span>
                <span id="score-display" class="text-yellow-400 font-bold text-sm md:text-base">0</span>
            </div>

            <div id="speedometer" class="absolute left-4 bottom-4 w-12 h-36 md:w-16 md:h-48 bg-gray-900/80 rounded-full border-4 border-gray-700 flex flex-col items-center justify-end p-1 z-20 shadow-lg">
                <div class="w-full h-full relative rounded-full overflow-hidden flex flex-col justify-end bg-gray-800">
                    <div id="speed-bar" class="w-full bg-gradient-to-t from-green-400 via-yellow-400 to-red-500 rounded-full" style="height: 0%;"></div>
                </div>
                <div class="absolute top-3 text-gray-300 font-bold text-[10px] md:text-xs">km/h</div>
                <div id="speed-text" class="absolute bottom-3 text-white font-bold text-sm md:text-lg">0</div>
            </div>
            
            <div id="canvas-timer-bar-container" class="absolute top-0 left-0 w-full h-2 bg-gray-200/50 z-20">
                <div id="canvas-timer-bar" class="bg-blue-500 h-full w-0 transition-all duration-100" style="width: 0%;"></div>
            </div>
            
            <!-- 右上角总进度提示 -->
            <div class="absolute top-4 right-4 z-20 flex flex-col items-end gap-1.5">
                <div class="bg-gray-900/80 rounded-full border-2 border-gray-700 px-3 py-1.5 md:px-4 md:py-2 shadow-lg flex items-center gap-2">
                    <span class="text-white font-bold text-xs md:text-sm">🏁 距离终点:</span>
                    <span id="overall-progress-text" class="text-lime-400 font-bold text-sm md:text-base">0%</span>
                </div>
            </div>
            
            <button id="canvas-drive-btn" class="absolute bottom-4 right-4 bg-lime-600 hover:bg-lime-700 active:bg-lime-800 text-white font-bold w-16 h-16 rounded-full shadow-[0_5px_15px_rgba(0,0,0,0.3)] flex flex-col items-center justify-center z-20 border-4 border-white opacity-50 pointer-events-none select-none touch-none hidden">
                <span class="text-2xl mb-0.5 pointer-events-none">🚗</span>
                <span class="text-[10px] uppercase tracking-wider leading-none pointer-events-none">Hold</span>
            </button>
        </div>

        <div id="ui-container" class="bg-white rounded-t-3xl shadow-[0_-10px_30px_rgba(0,0,0,0.1)] z-10 p-4 flex flex-col">
            <div class="flex justify-end items-center mb-2 px-2">
                <div class="bg-blue-100 text-blue-800 px-4 py-1 rounded-full font-bold text-sm">
                    Question <span id="q-number">1</span>/<span id="q-total">20</span>
                </div>
            </div>

            <div class="flex-1 flex flex-col items-center justify-center overflow-y-auto">
                <h2 id="question-text" class="text-xl md:text-2xl font-bold text-gray-800 text-center mb-4 px-4"></h2>
                
                <div id="options-container" class="grid grid-cols-2 gap-3 w-full max-w-md px-2 transition-opacity duration-300"></div>

                <div id="explanation-container" class="hidden mt-4 p-4 bg-blue-50 border border-blue-100 text-blue-800 rounded-xl text-sm md:text-base w-full max-w-md mx-2 shadow-sm font-medium"></div>
                
                <button id="continue-btn" onclick="nextQuestion()" class="hidden mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl text-lg shadow-md transition-transform active:scale-95">Continue ➡️</button>
            </div>
        </div>
    </div>

    <!-- 弹窗 -->
    <div id="message-modal" class="hidden fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full text-center">
            <h3 id="modal-title" class="text-xl font-bold text-gray-800 mb-2">提示</h3>
            <p id="modal-msg" class="text-gray-600 mb-6"></p>
            <div id="password-area" class="hidden mb-6">
                <input type="password" id="teacher-pwd" placeholder="请输入密码" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex justify-center gap-3">
                <button id="modal-cancel-btn" onclick="closeModal()" class="hidden bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-6 rounded-lg">取消</button>
                <button id="modal-ok-btn" onclick="closeModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg">确定</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 请将此处替换为您的 Firebase 配置 (之前已替换)
        const firebaseConfig = {
            apiKey: "AIzaSyDJFJq12eGnQO9UiyFuwK5V2qvRvv_NfuU",
            authDomain: "eng-y5-racecar.firebaseapp.com",
            databaseURL: "https://eng-y5-racecar-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "eng-y5-racecar",
            storageBucket: "eng-y5-racecar.firebasestorage.app",
            messagingSenderId: "628715478919",
            appId: "1:628715478919:web:100ed05292df9983c3fd22",
            measurementId: "G-BP6HPTZ9W7"
        };

        let app, auth, db;
        
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.error("Firebase 初始化失败:", e);
        }

        // English Plus 1 (Malaysia) - Unit 5-7 Grammar & Vocab
        const questions = [
            { q: "A _____ is a long orange vegetable.", options: ["potato", "carrot", "beef", "cheese"], correct: 1, exp: "解析：carrot 意为“胡萝卜”，是一种橙色的长条蔬菜 (Unit 5)。" },
            { q: "Eating too much _____ is bad for your teeth.", options: ["vegetables", "water", "sugar", "salad"], correct: 2, exp: "解析：sugar 意为“糖”，吃太多对牙齿不好，属于 unhealthy food (Unit 5)。" },
            { q: "Are there _____ eggs in the box?", options: ["some", "much", "a", "any"], correct: 3, exp: "解析：在疑问句中，通常使用 any 来修饰可数名词复数或不可数名词 (Unit 5)。" },
            { q: "I usually drink _____ milk in the morning.", options: ["any", "some", "many", "a"], correct: 1, exp: "解析：在肯定句中，修饰不可数名词 milk 通常使用 some (Unit 5)。" },
            { q: "How _____ time do we have before the train leaves?", options: ["many", "much", "any", "some"], correct: 1, exp: "解析：time 在这里表示“时间”，是不可数名词，提问要用 How much (Unit 5)。" },
            { q: "There are a _____ of people at the concert.", options: ["much", "many", "lot", "some"], correct: 2, exp: "解析：a lot of 意为“许多”，固定搭配，可修饰可数和不可数名词 (Unit 5)。" },
            { q: "You wear a white suit and use a belt in _____.", options: ["swimming", "judo", "basketball", "cycling"], correct: 1, exp: "解析：judo 意为“柔道”，运动时需要穿白色道服和系带 (Unit 6)。" },
            { q: "We went _____ in the mountains last winter.", options: ["skiing", "tennis", "athletics", "football"], correct: 0, exp: "解析：skiing 意为“滑雪”，通常在冬天的高山上进行 (Unit 6)。" },
            { q: "You swim in a swimming _____.", options: ["court", "pitch", "pool", "track"], correct: 2, exp: "解析：swimming pool 意为“游泳池”。court 是球场，pitch 是足球/草地场 (Unit 6)。" },
            { q: "My brother _____ a new bicycle last week.", options: ["buy", "buys", "bought", "buying"], correct: 2, exp: "解析：last week 表示一般过去时，buy 的过去式是不规则动词 bought (Unit 6)。" },
            { q: "They _____ the race because they were too slow.", options: ["didn't win", "don't win", "didn't won", "aren't winning"], correct: 0, exp: "解析：一般过去时的否定句结构为：didn't + 动词原形 (Unit 6)。" },
            { q: "I _____ a letter to my friend yesterday.", options: ["write", "wrote", "written", "writing"], correct: 1, exp: "解析：yesterday 是一般过去时标志，write 的过去式是 wrote (Unit 6)。" },
            { q: "_____ she go to the supermarket?", options: ["Does", "Do", "Is", "Did"], correct: 3, exp: "解析：一般过去时的疑问句，句首需要用助动词 Did (Unit 6/7)。" },
            { q: "My grandfather is old and has a white _____.", options: ["beard", "hair", "glasses", "tall"], correct: 0, exp: "解析：beard 意为“胡子/络腮胡”。通常用来描述面部特征 (Unit 7)。" },
            { q: "She wears _____ to read books.", options: ["glasses", "eyes", "ears", "hair"], correct: 0, exp: "解析：glasses 意为“眼镜”，用来形容人的外貌特征和配件 (Unit 7)。" },
            { q: "He isn't tall or short. He is _____ height.", options: ["medium", "average", "middle", "normal"], correct: 1, exp: "解析：average height 意为“中等/普通身高”，是描述身高的固定词组 (Unit 7)。" },
            { q: "This present is for my sister. Give it to _____.", options: ["she", "him", "her", "me"], correct: 2, exp: "解析：介词 to 后面接宾格代词，my sister 是女性，因此用 her (Unit 7)。" },
            { q: "We are playing a game. Come and join _____!", options: ["we", "our", "us", "them"], correct: 2, exp: "解析：join 是动词，后面接宾格代词。代替 we 的宾格是 us (Unit 7)。" },
            { q: "Where _____ your parents born?", options: ["was", "were", "are", "did"], correct: 1, exp: "解析：parents 是复数，且询问出生用过去时，be动词应使用 were (Unit 7)。" },
            { q: "The weather _____ very cold last night.", options: ["were", "is", "did", "was"], correct: 3, exp: "解析：weather 是不可数名词单数，last night 是过去时，因此 be动词用 was (Unit 7)。" }
        ];

        document.getElementById('q-total').innerText = questions.length;

        let currentQuestionIndex = 0;
        let score = 0;
        let playerName = "";
        
        let canDrive = false;
        let isHoldingGo = false;
        let driveTimeAccumulated = 0;
        
        const TOTAL_DRIVE_TIME_NEEDED = 6000; // 6秒长冲刺
        
        let moveProgress = 0; 
        const PROGRESS_PER_QUESTION = 1 / questions.length; 
        
        let currentSpeed = 0; 
        let lastTime = 0;
        let hasAnsweredCurrentQuestion = false;

        async function initFirebaseAndAuth() {
            if (!auth) return;
            try {
                await signInAnonymously(auth);
                const lbRef = collection(db, 'leaderboard');
                onSnapshot(lbRef, (snapshot) => {
                    let records = [];
                    snapshot.forEach(doc => records.push(doc.data()));
                    records.sort((a, b) => b.score - a.score);
                    renderLeaderboard(records);
                });
            } catch (e) {
                console.error("Firebase Auth 失败:", e);
            }
        }

        function renderLeaderboard(records) {
            const container = document.getElementById('leaderboard-container');
            container.innerHTML = '';
            if (records.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-400 py-2">暂无排名数据</div>';
                return;
            }
            records.forEach((record, index) => {
                const rankColor = index === 0 ? 'text-yellow-500' : (index === 1 ? 'text-gray-400' : (index === 2 ? 'text-amber-600' : 'text-gray-400'));
                container.innerHTML += `
                    <div class="bg-white rounded-lg p-3 flex justify-between items-center shadow-sm border border-gray-100">
                        <div class="flex items-center gap-3">
                            <span class="${rankColor} font-bold text-lg">${index + 1}.</span>
                            <span class="text-gray-800 font-medium">${record.name}</span>
                        </div>
                        <div class="text-right">
                            <span class="text-emerald-700 font-bold">${record.score}分</span>
                        </div>
                    </div>`;
            });
        }

        async function submitScore() {
            if (!auth || !auth.currentUser || !playerName) return;
            try {
                const docRef = doc(db, 'leaderboard', auth.currentUser.uid);
                await setDoc(docRef, { name: playerName, score: score, timestamp: Date.now() });
            } catch (e) {
                console.error("提交分数失败:", e);
            }
        }

        let pendingModalConfirm = null;

        window.showMessage = function(title, msg, type = 'alert', onConfirm = null) {
            document.getElementById('message-modal').classList.remove('hidden');
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-msg').innerText = msg;
            
            const pwdArea = document.getElementById('password-area');
            const cancelBtn = document.getElementById('modal-cancel-btn');
            
            pwdArea.classList.add('hidden');
            document.getElementById('teacher-pwd').value = '';
            cancelBtn.classList.add('hidden');
            pendingModalConfirm = onConfirm;

            if (type === 'prompt') {
                pwdArea.classList.remove('hidden');
                cancelBtn.classList.remove('hidden');
            }
        }

        window.closeModal = function() {
            document.getElementById('message-modal').classList.add('hidden');
            if (typeof pendingModalConfirm === 'function') {
                const action = pendingModalConfirm;
                pendingModalConfirm = null;
                action();
            }
        }

        window.showTeacherLogin = function() {
            window.showMessage("教师专区", "请输入教师管理密码：", "prompt", () => {
                const pwd = document.getElementById('teacher-pwd').value;
                if (pwd === '2020Hui%%') {
                    window.showMessage("登录成功", "欢迎进入教师后台！(演示功能)");
                } else {
                    window.showMessage("错误", "密码错误，请重试！");
                }
            });
        }

        window.startGame = function() {
            const name = document.getElementById('student-name').value.trim();
            const email = document.getElementById('student-email').value.trim();

            if (!name) {
                window.showMessage("输入错误", "请输入学生姓名！");
                return;
            }
            
            if (!email.toLowerCase().endsWith('@moe-dl.edu.my')) {
                window.showMessage("格式错误", "邮箱必须以 @moe-dl.edu.my 结尾！\n(请检查拼写，切勿漏字)");
                return;
            }

            playerName = name;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            initAudio();
            submitScore(); 
            
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
                lastTime = performance.now();
                loadQuestion();
            }, 100);
        }

        function loadQuestion() {
            const q = questions[currentQuestionIndex];
            hasAnsweredCurrentQuestion = false;
            canDrive = false;
            driveTimeAccumulated = 0;
            
            document.getElementById('q-number').innerText = currentQuestionIndex + 1;
            document.getElementById('question-text').innerText = q.q;
            
            document.getElementById('options-container').classList.remove('pointer-events-none');
            document.getElementById('explanation-container').classList.add('hidden');
            
            const driveBtn = document.getElementById('canvas-drive-btn');
            driveBtn.classList.remove('hidden');
            driveBtn.classList.add('opacity-50', 'pointer-events-none');
            driveBtn.classList.remove('animate-pulse');
            
            document.getElementById('continue-btn').classList.add('hidden');
        
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option bg-red-500 hover:bg-red-600 text-white font-bold py-4 rounded-xl text-lg w-full transition-colors shadow-sm';
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(idx, btn);
                container.appendChild(btn);
            });
        }

        function handleAnswer(selectedIndex, btnElement) {
            if (hasAnsweredCurrentQuestion) return; 
            hasAnsweredCurrentQuestion = true;

            const q = questions[currentQuestionIndex];
            const allButtons = document.querySelectorAll('.btn-option');
            
            document.getElementById('options-container').classList.add('pointer-events-none');
            
            allButtons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.correct) {
                    btn.className = 'btn-option bg-green-200 text-green-900 border-2 border-green-500 font-bold py-4 rounded-xl text-lg w-full transition-colors shadow-sm scale-[1.02]';
                } else if (idx === selectedIndex && selectedIndex !== q.correct) {
                    btn.className = 'btn-option bg-red-600 text-white border-2 border-red-800 font-bold py-4 rounded-xl text-lg w-full opacity-90';
                } else {
                    btn.classList.add('opacity-40');
                }
            });

            if (selectedIndex === q.correct) {
                window.playCorrectSound(); 
                score += 20;
                document.getElementById('score-display').innerText = score;
                submitScore(); 
                
                canDrive = true;
                const driveBtn = document.getElementById('canvas-drive-btn');
                driveBtn.classList.remove('opacity-50', 'pointer-events-none');
                driveBtn.classList.add('animate-pulse'); 
            } else {
                window.playWrongSound(); 
                canDrive = false;
                document.getElementById('canvas-drive-btn').classList.add('hidden');
                document.getElementById('continue-btn').classList.remove('hidden');
            }

            const expContainer = document.getElementById('explanation-container');
            expContainer.innerText = q.exp;
            expContainer.classList.remove('hidden');
        }

        window.nextQuestion = function() {
            document.getElementById('continue-btn').classList.add('hidden');
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                document.getElementById('question-text').innerText = "🏆 终点达成！挑战完成！";
                document.getElementById('overall-progress-text').innerText = "100%";
                document.getElementById('explanation-container').classList.add('hidden');
                document.getElementById('q-number').innerText = questions.length;
                document.getElementById('canvas-drive-btn').classList.add('hidden');
                
                const optionsContainer = document.getElementById('options-container');
                optionsContainer.classList.remove('pointer-events-none');
                optionsContainer.innerHTML = `
                    <button onclick="resetGame(true)" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl text-lg w-full shadow-lg transition-transform active:scale-95">Play Again</button>
                    <button onclick="goMain()" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-4 rounded-xl text-lg w-full shadow-lg transition-transform active:scale-95">Main (主页)</button>
                `;
            }
        }

        window.resetGame = function(startImmediately) {
            currentQuestionIndex = 0;
            score = 0;
            moveProgress = 0;
            currentSpeed = 0;
            document.getElementById('score-display').innerText = '0';
            document.getElementById('canvas-timer-bar').style.width = '0%';
            document.getElementById('overall-progress-text').innerText = '0%';
            
            if (typeof coins !== 'undefined') {
                coins.forEach(coinData => {
                    if (!coinData.active) {
                        scene3D.add(coinData.mesh);
                        coinData.active = true;
                    }
                });
            }
            
            if (trackCurve && carModel) {
                updateCameraAndCar();
                if (renderer3D) renderer3D.render(scene3D, camera3D);
            }
            
            if (startImmediately) {
                loadQuestion();
            }
        }

        window.goMain = function() {
            resetGame(false);
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('student-name').value = '';
            document.getElementById('student-email').value = '';
        }

        const goBtn = document.getElementById('canvas-drive-btn');

        function startDriveAction(e) {
            if (e && e.cancelable) e.preventDefault(); 
            if (!canDrive) return;
            isHoldingGo = true;
            window.playEngineSound();
            goBtn.classList.remove('animate-pulse');
            goBtn.classList.add('scale-90', 'border-lime-300');
        }

        function stopDriveAction(e) {
            isHoldingGo = false;
            if (window.stopEngineSound) window.stopEngineSound();
            if (goBtn) goBtn.classList.remove('scale-90', 'border-lime-300');
        }

        goBtn.addEventListener('mousedown', startDriveAction);
        goBtn.addEventListener('touchstart', startDriveAction, {passive: false});
        
        window.addEventListener('mouseup', stopDriveAction);
        window.addEventListener('touchend', stopDriveAction);

        let audioCtx;
        let engineOsc, engineGain, engineFilter;

        function initAudio() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            const unlockSource = audioCtx.createBufferSource();
            unlockSource.buffer = audioCtx.createBuffer(1, 1, 22050);
            unlockSource.connect(audioCtx.destination);
            unlockSource.start(0);

            engineOsc = audioCtx.createOscillator();
            engineOsc.type = 'sawtooth';
            engineOsc.frequency.value = 60; 
            
            engineFilter = audioCtx.createBiquadFilter();
            engineFilter.type = 'lowpass';
            engineFilter.frequency.value = 120;
            
            engineGain = audioCtx.createGain();
            engineGain.gain.value = 0; 
            
            engineOsc.connect(engineFilter);
            engineFilter.connect(engineGain);
            engineGain.connect(audioCtx.destination);
            engineOsc.start();
        }

        window.playCorrectSound = () => {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.frequency.setValueAtTime(659.25, t); 
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.04, t + 0.05); 
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
            
            osc.frequency.setValueAtTime(1046.50, t + 0.15); 
            gain.gain.setValueAtTime(0, t + 0.15);
            gain.gain.linearRampToValueAtTime(0.04, t + 0.2);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
            
            osc.start(t);
            osc.stop(t + 0.6);
        };

        window.playWrongSound = () => {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.frequency.setValueAtTime(200, t);
            osc.frequency.exponentialRampToValueAtTime(100, t + 0.3);
            
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.03, t + 0.05); 
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
            
            osc.start(t);
            osc.stop(t + 0.4);
        };

        window.playEngineSound = () => {
            if (!audioCtx || !engineGain) return;
            engineGain.gain.setTargetAtTime(0.08, audioCtx.currentTime, 0.1);
            engineOsc.frequency.setTargetAtTime(110, audioCtx.currentTime, 0.5); 
            engineFilter.frequency.setTargetAtTime(400, audioCtx.currentTime, 0.5);
        };

        window.stopEngineSound = () => {
            if (!audioCtx || !engineGain) return;
            engineGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.2);
            engineOsc.frequency.setTargetAtTime(60, audioCtx.currentTime, 0.3);
            engineFilter.frequency.setTargetAtTime(120, audioCtx.currentTime, 0.3);
        };

        window.playCoinSound = () => {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.frequency.setValueAtTime(987.77, t); 
            osc.frequency.setValueAtTime(1318.51, t + 0.1); 
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.1, t + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
            
            osc.start(t);
            osc.stop(t + 0.4);
        };

        let scene3D, camera3D, renderer3D, carModel, trackCurve;
        let animatedEnvironment = []; 
        let coins = []; 

        function init3D() {
            const canvas = document.getElementById('game-canvas');
            const container = document.getElementById('canvas-container');
            
            scene3D = new THREE.Scene();
            scene3D.background = new THREE.Color(0x7ec8e3); 
            scene3D.fog = new THREE.Fog(0x7ec8e3, 100, 4000);

            camera3D = new THREE.PerspectiveCamera(85, container.clientWidth / container.clientHeight, 0.1, 5000);
            
            renderer3D = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer3D.setSize(container.clientWidth, container.clientHeight);
            renderer3D.setPixelRatio(window.devicePixelRatio);

            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene3D.add(ambient);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(100, 200, 50);
            scene3D.add(dirLight);

            const sunGeo = new THREE.SphereGeometry(60, 32, 32);
            const sunMat = new THREE.MeshBasicMaterial({color: 0xffe87c});
            const sun = new THREE.Mesh(sunGeo, sunMat);
            sun.position.set(-500, 400, -1000); 
            scene3D.add(sun);
            animatedEnvironment.push({ obj: sun, type: 'sun' });

            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(30000, 30000), 
                new THREE.MeshPhongMaterial({color: 0x66c066}) 
            );
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.5;
            scene3D.add(ground);

            const points = [];
            let curX = 0, curZ = 0;
            // 增加跑道长度和弯度，提升速度感
            for(let i=0; i<60; i++) {
                points.push(new THREE.Vector3(curX, 0, curZ));
                let curveAmount = Math.sin(i * 0.5) * 1500 + (Math.random() - 0.5) * 800;
                curX += curveAmount; 
                curZ -= 2000; 
            }
            trackCurve = new THREE.CatmullRomCurve3(points);
            
            const tubeGeo = new THREE.TubeGeometry(trackCurve, 1500, 15, 8, false);
            tubeGeo.scale(1, 0.05, 1);
            const roadMat = new THREE.MeshPhongMaterial({color: 0x4b5563});
            const road = new THREE.Mesh(tubeGeo, roadMat);
            scene3D.add(road);

            carModel = new THREE.Group();
            
            const bodyMat = new THREE.MeshPhongMaterial({color: 0xe74c3c});
            const body = new THREE.Mesh(new THREE.BoxGeometry(10, 3, 16), bodyMat);
            body.position.y = 2.5;
            carModel.add(body);

            const topMat = new THREE.MeshPhongMaterial({color: 0x222222});
            const carTop = new THREE.Mesh(new THREE.BoxGeometry(8, 3, 8), topMat);
            carTop.position.set(0, 5.5, -1);
            carModel.add(carTop);

            const chassisMat = new THREE.MeshPhongMaterial({color: 0x2c3e50});
            const chassis = new THREE.Mesh(new THREE.BoxGeometry(10.5, 1, 17), chassisMat);
            chassis.position.y = 0.5;
            carModel.add(chassis);

            const spoilerMat = new THREE.MeshPhongMaterial({color: 0xe74c3c});
            const spoilerBoard = new THREE.Mesh(new THREE.BoxGeometry(11, 1, 4), spoilerMat);
            spoilerBoard.position.set(0, 7, 7);
            
            const supportMat = new THREE.MeshPhongMaterial({color: 0x2c3e50});
            const support1 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 3, 1), supportMat);
            support1.position.set(-3, 5.5, 7);
            const support2 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 3, 1), supportMat);
            support2.position.set(3, 5.5, 7);
            carModel.add(spoilerBoard, support1, support2);

            const tailLightMat = new THREE.MeshBasicMaterial({color: 0xff0000});
            const tL = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 0.5), tailLightMat);
            tL.position.set(-3, 2.5, 8.1);
            const tR = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 0.5), tailLightMat);
            tR.position.set(3, 2.5, 8.1);
            carModel.add(tL, tR);

            const wheelMat = new THREE.MeshPhongMaterial({color: 0x111111});
            const wheelGeo = new THREE.CylinderGeometry(2, 2, 1.5, 16);
            wheelGeo.rotateZ(Math.PI / 2);
            const positions = [[-5.5, 2, -5], [5.5, 2, -5], [-5.5, 2, 5], [5.5, 2, 5]];
            positions.forEach(pos => {
                const w = new THREE.Mesh(wheelGeo, wheelMat);
                w.position.set(...pos);
                carModel.add(w);
            });

            scene3D.add(carModel);

            function spawnScenery(pos, lookTarget) {
                const rand = Math.random();
                let obj;
                if (rand < 0.5) {
                    obj = new THREE.Group();
                    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 2, 8), new THREE.MeshPhongMaterial({color: 0x8B4513}));
                    trunk.position.y = 4;
                    const leaves = new THREE.Mesh(new THREE.ConeGeometry(7, 18, 6), new THREE.MeshPhongMaterial({color: 0x2e8b57}));
                    leaves.position.y = 16;
                    obj.add(trunk, leaves);
                } else if (rand < 0.7) {
                    obj = new THREE.Group();
                    const height = 15 + Math.random() * 20;
                    const bldg = new THREE.Mesh(new THREE.BoxGeometry(15, height, 15), new THREE.MeshPhongMaterial({color: 0xe5e7eb}));
                    bldg.position.y = height / 2;
                    const roof = new THREE.Mesh(new THREE.ConeGeometry(12, 12, 4), new THREE.MeshPhongMaterial({color: 0xef4444}));
                    roof.position.y = height + 6;
                    roof.rotation.y = Math.PI / 4;
                    obj.add(bldg, roof);
                } else {
                    obj = new THREE.Mesh(new THREE.BoxGeometry(6, 7, 10), new THREE.MeshPhongMaterial({color: 0xfcd34d}));
                    obj.position.y = 3.5;
                }
                obj.position.copy(pos);
                obj.lookAt(lookTarget);
                scene3D.add(obj);
            }

            for(let i=0.003; i<0.99; i+=0.002) {
                const pt = trackCurve.getPointAt(i);
                const tangent = trackCurve.getTangentAt(i);
                const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
                
                const pos1 = pt.clone().add(normal.clone().multiplyScalar(30 + Math.random() * 30));
                spawnScenery(pos1, pt);
                const pos2 = pt.clone().add(normal.clone().multiplyScalar(-30 - Math.random() * 30));
                spawnScenery(pos2, pt);
            }

            // 巨大且清晰的金色光环 (金币)
            coins = [];
            const coinGeo = new THREE.TorusGeometry(18, 3, 16, 32); 
            const coinMat = new THREE.MeshStandardMaterial({
                color: 0xffd700, 
                emissive: 0xffaa00, 
                emissiveIntensity: 0.8,
                metalness: 1,
                roughness: 0.1
            });
            
            for(let i=0.01; i<0.99; i+=0.015) { 
                const pt = trackCurve.getPointAt(i);
                const tangent = trackCurve.getTangentAt(i);
                
                const coin = new THREE.Mesh(coinGeo, coinMat);
                coin.position.copy(pt);
                coin.position.y += 10; // 调高防止穿模
                // 让光环正对着赛道方向，像拱门一样
                coin.lookAt(pt.clone().add(tangent)); 

                scene3D.add(coin);
                coins.push({ mesh: coin, active: true, progress: i });
            }

            updateCameraAndCar();
            renderer3D.render(scene3D, camera3D);
            lastTime = performance.now();
            requestAnimationFrame(animate3D);
        }

        function updateCameraAndCar() {
            if(!trackCurve || !carModel) return;
            
            const pt = trackCurve.getPointAt(moveProgress);
            const tangent = trackCurve.getTangentAt(moveProgress);
            
            carModel.position.copy(pt);
            const lookAtPt = pt.clone().add(tangent);
            carModel.lookAt(lookAtPt);

            const camOffset = tangent.clone().multiplyScalar(-35);
            camOffset.y = 15; 
            camera3D.position.copy(pt).add(camOffset);
            camera3D.lookAt(pt.clone().add(new THREE.Vector3(0, 5, 0))); 

            animatedEnvironment.forEach(item => {
                if(item.type === 'sun') {
                    item.obj.position.copy(pt).add(tangent.clone().multiplyScalar(2000));
                    item.obj.position.y = 500;
                }
            });
        }

        function animate3D(time) {
            requestAnimationFrame(animate3D);
            
            const dt = time - lastTime;
            lastTime = time;

            if (canDrive && isHoldingGo && driveTimeAccumulated < TOTAL_DRIVE_TIME_NEEDED) {
                driveTimeAccumulated += dt;
                
                if (driveTimeAccumulated > TOTAL_DRIVE_TIME_NEEDED) {
                    driveTimeAccumulated = TOTAL_DRIVE_TIME_NEEDED;
                }

                const progressRatio = dt / TOTAL_DRIVE_TIME_NEEDED;
                moveProgress += progressRatio * PROGRESS_PER_QUESTION;
                
                if (moveProgress > 1) moveProgress = 1;
                
                updateCameraAndCar();

                currentSpeed = Math.min(currentSpeed + dt * 0.5, 250); 
                
                // 检测车子是否穿过金币光环
                coins.forEach(coinData => {
                    if (coinData.active && Math.abs(coinData.progress - moveProgress) < 0.004) {
                        coinData.active = false;
                        scene3D.remove(coinData.mesh); 
                        score += 1; 
                        document.getElementById('score-display').innerText = score;
                        submitScore(); 
                        window.playCoinSound(); 
                        
                        // 按钮震动特效
                        const driveBtn = document.getElementById('canvas-drive-btn');
                        driveBtn.classList.remove('btn-shake');
                        void driveBtn.offsetWidth; 
                        driveBtn.classList.add('btn-shake');
                        
                        // 飘浮加分特效
                        const canvasContainer = document.getElementById('canvas-container');
                        const plusOneText = document.createElement('div');
                        plusOneText.innerText = '+ 1';
                        plusOneText.className = 'absolute text-6xl md:text-8xl font-black text-yellow-300 drop-shadow-[0_0_20px_rgba(255,215,0,1)] z-50 pointer-events-none transition-all duration-1000 ease-out italic tracking-wider';
                        plusOneText.style.left = '50%';
                        plusOneText.style.top = '50%';
                        plusOneText.style.transform = 'translate(-50%, -50%)';
                        canvasContainer.appendChild(plusOneText);
                        
                        void plusOneText.offsetWidth;
                        
                        plusOneText.style.top = '15%';
                        plusOneText.style.opacity = '0';
                        plusOneText.style.transform = 'translate(-50%, -50%) scale(1.8)';
                        
                        setTimeout(() => {
                            if (plusOneText.parentNode) plusOneText.parentNode.removeChild(plusOneText);
                        }, 1000);
                    }
                });

            } else {
                currentSpeed = Math.max(currentSpeed - dt * 0.2, 0);

                if (canDrive && driveTimeAccumulated >= TOTAL_DRIVE_TIME_NEEDED) {
                    canDrive = false;
                    isHoldingGo = false;
                    window.stopEngineSound();
                    
                    document.getElementById('canvas-drive-btn').classList.add('hidden');
                    document.getElementById('continue-btn').classList.remove('hidden');
                }
            }

            document.getElementById('speed-text').innerText = Math.floor(currentSpeed);
            document.getElementById('speed-bar').style.height = `${(currentSpeed / 250) * 100}%`;
            document.getElementById('canvas-timer-bar').style.width = `${moveProgress * 100}%`;
            
            // 更新右上角的总进度百分比
            const progressPercent = Math.min(100, Math.floor(moveProgress * 100));
            document.getElementById('overall-progress-text').innerText = progressPercent + '%';

            // 让路上的光环稍微自转增加动感
            coins.forEach(coinData => {
                if (coinData.active) {
                    coinData.mesh.rotation.z += 0.05;
                }
            });

            renderer3D.render(scene3D, camera3D);
        }

        window.addEventListener('resize', () => {
            if (!camera3D || !renderer3D) return;
            const container = document.getElementById('canvas-container');
            if (container.clientWidth === 0) return; 
            camera3D.aspect = container.clientWidth / container.clientHeight;
            camera3D.updateProjectionMatrix();
            renderer3D.setSize(container.clientWidth, container.clientHeight);
            renderer3D.render(scene3D, camera3D);
        });

        window.onload = () => {
            initFirebaseAndAuth(); 
            init3D();
        };

    </script>
</body>
